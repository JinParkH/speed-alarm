<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000">
<title>내 차</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050505; color: #eee;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; padding: 16px; box-sizing: border-box; }
  form { width: 100%; max-width: 320px; display: grid; gap: 12px; text-align: center; }
  input { font: inherit; font-size: 28px; letter-spacing: .3em; text-align: center; padding: 14px; border-radius: 14px; border: 1px solid #333; background: #151515; color: #fff; }
  button { font: inherit; font-size: 18px; font-weight: 600; padding: 14px; border-radius: 14px; border: 0; background: #0a7d3c; color: #fff; }
  p { color: #888; margin: 0; } .bad { color: #ff5a5a; }
</style></head>
<body>
<form method="post" action="/pin">
  <h2 style="margin:0">내 차 상태</h2>
  <p>PIN 6자리</p>
  <input name="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="12" autofocus>
  <p class="bad" id="bad" hidden>PIN이 맞지 않습니다</p>
  <button>들어가기</button>
</form>
<script>if (location.search.includes('bad')) document.getElementById('bad').hidden = false;</script>
</body></html>
