<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="내 차">
<meta name="theme-color" content="#000">
<title>내 차</title>
<style>
  :root { --bg:#050505; --card:#131313; --line:#232323; --fg:#f2f2f2; --dim:#8b8b8b; --green:#3ddc84; --amber:#ffb020; --red:#ff4d4d; --blue:#4da3ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 24px; margin: 0; }
  .sub { color: var(--dim); font-size: 13px; }
  .state { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: var(--card); border-radius: 18px; padding: 14px; min-width: 0; }
  .wide { grid-column: 1 / -1; }
  .k { color: var(--dim); font-size: 13px; margin-bottom: 6px; }
  .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .v small { font-size: 14px; color: var(--dim); font-weight: 500; }
  .bat { display: flex; align-items: center; gap: 14px; }
  .bat .big { font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .bar { height: 10px; background: #262626; border-radius: 6px; overflow: hidden; margin-top: 10px; position: relative; }
  .bar i { display: block; height: 100%; background: var(--green); border-radius: 6px; }
  .bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff8; }
  .ok { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); }
  .list { display: grid; gap: 6px; font-size: 15px; }
  .list div { display: flex; justify-content: space-between; gap: 8px; }
  .tires { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tires span small { color: var(--dim); font-size: 12px; font-weight: 500; margin-right: 4px; }
  a { color: var(--blue); text-decoration: none; }
  svg { width: 100%; height: 70px; display: block; }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  button { flex: 1; font: inherit; font-size: 16px; font-weight: 600; color: var(--fg); background: #1d1d1d; border: 1px solid #2c2c2c; border-radius: 14px; padding: 13px; }
  button:disabled { opacity: .5; }
  .note { color: var(--dim); font-size: 12px; margin-top: 10px; line-height: 1.5; }
  .banner { background: #2a1e05; color: var(--amber); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
  .banner a { color: #fff; font-weight: 600; }
  @media (min-width: 700px) { body { max-width: 760px; margin: 0 auto; } .grid { grid-template-columns: repeat(4, 1fr); } .half { grid-column: span 2; } }
</style>
</head>
<body>
<header>
  <div><h1 id="name">내 차</h1><div class="sub" id="updated">-</div></div>
  <span class="state" id="state">-</span>
</header>
<div id="banners"></div>
<div class="grid" id="grid" hidden>
  <div class="card wide">
    <div class="k">배터리</div>
    <div class="bat"><div class="big" id="bat">--</div><div><div class="v" id="range">-- <small>km</small></div><div class="sub" id="charge">-</div></div></div>
    <div class="bar"><i id="batBar" style="width:0"></i><b id="limitMark" style="left:80%"></b></div>
    <svg id="spark" viewBox="0 0 300 70" preserveAspectRatio="none" aria-label="최근 24시간 배터리"></svg>
    <div class="sub">최근 24시간 배터리</div>
  </div>
  <div class="card half"><div class="k">잠금</div><div class="v" id="lock">-</div><div class="sub" id="sentry">-</div></div>
  <div class="card half"><div class="k">실내 / 실외</div><div class="v" id="temp">-</div><div class="sub" id="climate">-</div></div>
  <div class="card wide"><div class="k">문 · 창문 · 트렁크</div><div class="list" id="openings"></div></div>
  <div class="card wide"><div class="k">타이어 공기압 (psi)</div><div class="tires" id="tires"></div><div class="sub" id="tireNote"></div></div>
  <div class="card half"><div class="k">위치</div><div class="v" style="font-size:18px" id="loc">-</div></div>
  <div class="card half"><div class="k">주행거리 · 소프트웨어</div><div class="v" style="font-size:20px" id="odo">-</div><div class="sub" id="ver">-</div></div>
</div>
<div class="actions">
  <button id="refreshBtn">새로고침</button>
  <button id="wakeBtn">차 깨우기</button>
</div>
<div class="note" id="note"></div>

<script>
const $ = (id) => document.getElementById(id);
const PSI = 14.5038;
let busy = false;

function ago(t) {
  if (!t) return '-';
  const s = Math.round((Date.now() - t) / 1000);
  if (s < 60) return `${s}초 전`;
  if (s < 3600) return `${Math.round(s / 60)}분 전`;
  if (s < 86400) return `${Math.round(s / 3600)}시간 전`;
  return new Date(t).toLocaleString('ko-KR');
}
const CHARGE = { Charging: '충전 중', Complete: '충전 완료', Disconnected: '충전기 연결 안 됨', Stopped: '충전 멈춤', NoPower: '전원 없음', Starting: '충전 시작 중' };
const SHIFT = { D: '주행 중', R: '후진 중', N: '중립', P: '주차' };

async function load() {
  const r = await fetch('/api/status');
  if (r.status === 401) return location.reload();
  const d = await r.json();
  render(d);
  const h = await fetch('/api/history?hours=24').then((x) => x.json()).catch(() => []);
  spark(h);
}

function render(d) {
  const b = [];
  if (d.mock) b.push('가짜 데이터로 보는 화면입니다 (MOCK).');
  if (!d.configured) b.push('테슬라 개발자 앱 정보(client_id / client_secret)가 아직 없습니다. README의 "테슬라 등록" 순서를 따라주세요.');
  else if (!d.loggedIn) b.push('테슬라 계정 연결이 필요합니다. <a href="/login">테슬라로 로그인</a>');
  if (d.error) b.push('오류: ' + d.error);
  $('banners').innerHTML = b.map((x) => `<div class="banner">${x}</div>`).join('');

  const s = d.snapshot;
  const st = $('state');
  if (d.asleep) { st.textContent = '잠듦'; st.className = 'state'; }
  else if (s) {
    const driving = s.shift && s.shift !== 'P';
    st.textContent = driving ? `${SHIFT[s.shift] || '주행 중'} ${s.speed_kmh ?? ''}${s.speed_kmh != null ? 'km/h' : ''}` : s.charging === 'Charging' ? '충전 중' : '주차';
    st.className = 'state ' + (driving ? 'ok' : '');
  }
  $('updated').textContent = s ? `데이터 ${ago(s.t)}${d.asleep ? ' (지금은 잠듦)' : ''}` : '아직 데이터 없음';
  $('note').innerHTML = `이번 달 조회 ${d.cost.data}회 · 깨우기 ${d.cost.wake}회 · 약 $${d.cost.usd} / 자동조회 상한 $${d.budget} (테슬라 월 $10 무료 한도)<br>`
    + `깨우기는 회당 약 $0.02이고 차 배터리를 조금 씁니다. 잠든 차는 자동으로 깨우지 않습니다.`;
  $('grid').hidden = !s;
  if (!s) return;

  $('name').textContent = s.name;
  $('bat').textContent = s.battery != null ? s.battery + '%' : '--';
  $('bat').className = 'big ' + (s.battery < 20 ? 'bad' : s.battery < 35 ? 'warn' : '');
  $('range').innerHTML = `${s.range_km ?? '--'} <small>km</small>`;
  $('batBar').style.width = (s.battery || 0) + '%';
  $('batBar').style.background = s.battery < 20 ? 'var(--red)' : s.charging === 'Charging' ? 'var(--blue)' : 'var(--green)';
  $('limitMark').style.left = (s.charge_limit || 80) + '%';
  let ch = CHARGE[s.charging] || s.charging || '-';
  if (s.charging === 'Charging') ch += ` · ${s.charge_kw ?? '?'}kW · 완료까지 ${Math.floor((s.minutes_to_full || 0) / 60)}시간 ${(s.minutes_to_full || 0) % 60}분`;
  $('charge').textContent = `${ch} · 충전 목표 ${s.charge_limit ?? '-'}%`;

  $('lock').textContent = s.locked == null ? '-' : s.locked ? '잠김' : '열림';
  $('lock').className = 'v ' + (s.locked === false ? 'bad' : 'ok');
  $('sentry').textContent = s.sentry == null ? '' : s.sentry ? '감시 모드 켜짐' : '감시 모드 꺼짐';

  $('temp').innerHTML = `${s.inside_c != null ? Math.round(s.inside_c) : '-'}° <small>/ ${s.outside_c != null ? Math.round(s.outside_c) : '-'}°</small>`;
  $('climate').textContent = s.climate_on ? '공조 켜짐' : '공조 꺼짐';

  const names = { fl: '운전석', fr: '조수석', rl: '뒷좌석 왼쪽', rr: '뒷좌석 오른쪽' };
  const open = [];
  for (const [k, v] of Object.entries(s.doors || {})) if (v) open.push(`${names[k]} 문`);
  for (const [k, v] of Object.entries(s.windows || {})) if (v) open.push(`${names[k]} 창문`);
  if (s.trunk?.front) open.push('앞 트렁크'); if (s.trunk?.rear) open.push('뒤 트렁크');
  $('openings').innerHTML = open.length
    ? open.map((x) => `<div><span>${x}</span><span class="bad">열림</span></div>`).join('')
    : '<div><span>모두 닫힘</span><span class="ok">✓</span></div>';

  const t = s.tpms_bar || {}, vals = Object.values(t).filter((x) => x != null);
  const max = Math.max(...vals);
  // 0.25bar(약 4psi) 이상 낮거나 2.4bar 미만이면 경고, 0.15bar 이상 낮으면 주의 (부동소수 오차 피하려고 경계를 반 칸 낮춤)
  const level = (v) => (v < 2.4 || max - v >= 0.25 ? 'bad' : max - v >= 0.15 ? 'warn' : '');
  const tire = (k, label) => {
    const v = t[k]; if (v == null) return `<span><small>${label}</small>-</span>`;
    return `<span class="${level(v)}"><small>${label}</small>${Math.round(v * PSI)}</span>`;
  };
  $('tires').innerHTML = tire('fl', '앞왼') + tire('fr', '앞오') + tire('rl', '뒤왼') + tire('rr', '뒤오');
  const worst = vals.map(level).includes('bad') ? 'bad' : vals.map(level).includes('warn') ? 'warn' : '';
  $('tireNote').textContent = !vals.length ? '주행 후에 값이 나옵니다' : worst === 'bad' ? '다른 바퀴보다 많이 낮은 타이어가 있습니다' : worst === 'warn' ? '조금 낮은 타이어가 있습니다' : '정상 범위';
  $('tireNote').className = 'sub ' + worst;

  $('loc').innerHTML = s.lat != null
    ? `<a href="https://map.kakao.com/link/map/내 차,${s.lat},${s.lon}" target="_blank" rel="noopener">지도에서 보기 ›</a>`
    : '위치 권한 없음';
  $('odo').textContent = s.odometer_km != null ? s.odometer_km.toLocaleString() + ' km' : '-';
  $('ver').textContent = (s.version || '-') + (s.update_available ? ' · 업데이트 있음' : '');
}

function spark(h) {
  const svg = $('spark');
  const pts = h.filter((p) => p.b != null);
  if (pts.length < 2) { svg.innerHTML = '<text x="150" y="40" fill="#555" font-size="12" text-anchor="middle">기록이 쌓이면 그래프가 나옵니다</text>'; return; }
  const t0 = Date.now() - 24 * 3600e3, x = (t) => ((t - t0) / (24 * 3600e3)) * 300, y = (b) => 66 - (b / 100) * 62;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.b).toFixed(1)}`).join(' ');
  svg.innerHTML = `<path d="${line} L${x(pts.at(-1).t).toFixed(1)},70 L${x(pts[0].t).toFixed(1)},70 Z" fill="#3ddc8422"/><path d="${line}" fill="none" stroke="#3ddc84" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}

async function act(path, btn, label) {
  if (busy) return; busy = true;
  const old = btn.textContent; btn.textContent = label; btn.disabled = true;
  try { await fetch(path, { method: 'POST' }); await load(); } finally { btn.textContent = old; btn.disabled = false; busy = false; }
}
$('refreshBtn').onclick = () => act('/api/refresh', $('refreshBtn'), '불러오는 중…');
$('wakeBtn').onclick = () => { if (confirm('차를 깨울까요? (회당 약 $0.02, 최대 1분 걸림)')) act('/api/wake', $('wakeBtn'), '깨우는 중…'); };
load();
setInterval(() => { if (document.visibilityState === 'visible' && !busy) load(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
</script>
</body>
</html>
